<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/y-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yefta Kurnia Paradita | Portfolio</title>
    <script>
      (function() {
        try {
          const COLORS = [
            { name: 'Emerald', hex: '#10b981', rgb: '16 185 129', glow: 'rgba(16, 185, 129, 0.4)' },
            { name: 'Cyan', hex: '#06b6d4', rgb: '6 182 212', glow: 'rgba(6, 182, 212, 0.4)' },
            { name: 'Blue', hex: '#3b82f6', rgb: '59 130 246', glow: 'rgba(59, 130, 246, 0.4)' },
            { name: 'Indigo', hex: '#6366f1', rgb: '99 102 241', glow: 'rgba(99, 102, 241, 0.4)' },
            { name: 'Amber', hex: '#f59e0b', rgb: '245 158 11', glow: 'rgba(245, 158, 11, 0.4)' },
            { name: 'Slate', hex: '#94a3b8', rgb: '148 163 184', glow: 'rgba(148, 163, 184, 0.4)' },
          ];
          const savedColorName = localStorage.getItem('portfolio-accent-color');
          if (savedColorName) {
            const color = COLORS.find(c => c.name === savedColorName);
            if (color) {
              document.documentElement.style.setProperty('--primary-color', color.hex);
              document.documentElement.style.setProperty('--primary-rgb', color.rgb);
              document.documentElement.style.setProperty('--primary-glow', color.glow);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
